<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archivos GPX</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.archivo{
    display:flex;
    align-items:center;
    width:360px;
}

.icono{
    width:52px;
    height:62px;
    margin-right:24px;
    flex-shrink:0;
}

.icono-documento{
    width:100%;
    height:100%;
    fill:#777777;
}

.archivo a{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    text-decoration:none;
    white-space:nowrap;
}

.archivo a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="archivo">

<div class="icono">
<svg class="icono-documento" viewBox="0 0 64 76" aria-hidden="true">
    <path d="M8 2h32l16 16v56H8z"/>
    <path d="M40 2v16h16" fill="#ffffff"/>
    <path d="M18 34h28M18 46h28M18 58h20"
          stroke="#ffffff"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>
</svg>
</div>

<a href="gpx/gr10.gpx">gr10.gpx</a>

</div>

<div class="archivo">

<div class="icono">
<svg class="icono-documento" viewBox="0 0 64 76" aria-hidden="true">
    <path d="M8 2h32l16 16v56H8z"/>
    <path d="M40 2v16h16" fill="#ffffff"/>
    <path d="M18 34h28M18 46h28M18 58h20"
          stroke="#ffffff"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>
</svg>
</div>

<a href="gpx/bin.xml" download>bin.xml</a>

</div>

</div>

</body>
</html>
