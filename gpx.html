<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archivos GPX</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Conjunto centrado */
.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
}

/* Cada archivo */
.archivo{
    display:flex;
    align-items:center;
    width:260px;
}

/* Icono */
.icono{
    width:38px;
    height:46px;
    margin-right:16px;
    flex-shrink:0;
}

.documento{
    width:100%;
    height:100%;
    display:block;
}

/* Nombre */
.archivo a{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    text-decoration:none;
    white-space:nowrap;
}

.archivo a:hover{
    text-decoration:underline;
}

/* Rúbrica */
.rubrica{
    position:fixed;
    right:18px;
    bottom:12px;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

    font-size:24px;
    font-style:italic;
    font-weight:500;
    letter-spacing:0.3px;
    color:#555555;

    white-space:nowrap;
}

</style>

</head>

<body>

<div class="contenedor">

<!-- GR10 -->

<div class="archivo">

<div class="icono">

<svg class="documento"
     viewBox="0 0 100 120"
     aria-hidden="true">

    <!-- Hoja -->
    <path
        d="M13 5
           Q7 5 7 12
           V108
           Q7 115 14 115
           H82
           Q89 115 89 108
           V31
           L63 5
           Z"
        fill="#fcfcfc"
        stroke="#9d9d9d"
        stroke-width="1.8"/>

    <!-- Esquina doblada -->
    <path
        d="M63 5
           V25
           Q63 31 69 31
           H89
           L63 5 Z"
        fill="#ededed"
        stroke="#9d9d9d"
        stroke-width="1.8"/>

    <!-- Sombra suave -->
    <path
        d="M63 25
           L69 31
           H89
           L63 25 Z"
        fill="#d5d5d5"
        opacity="0.55"/>

    <!-- Pequeño contenido del documento -->
    <g
        fill="none"
        stroke="#a9a9a9"
        stroke-linecap="round"
        opacity="0.65">

        <path d="M20 39 H48" stroke-width="1.7"/>
        <path d="M53 39 H75" stroke-width="1.7"/>

        <path d="M20 47 H69" stroke-width="1.7"/>

        <path d="M20 55 H44" stroke-width="1.7"/>
        <path d="M49 55 H76" stroke-width="1.7"/>

        <path d="M20 63 H73" stroke-width="1.7"/>

        <path d="M20 71 H52" stroke-width="1.7"/>
        <path d="M57 71 H76" stroke-width="1.7"/>

        <path d="M20 79 H73" stroke-width="1.7"/>

        <path d="M20 90 H46" stroke-width="1.7"/>
        <path d="M51 90 H75" stroke-width="1.7"/>

        <path d="M20 98 H63" stroke-width="1.7"/>

    </g>

</svg>

</div>

<a href="gpx/gr10.gpx">gr10.gpx</a>

</div>

</body>
</html>
