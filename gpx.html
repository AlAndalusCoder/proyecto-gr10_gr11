<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archivos GPX</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
}

.archivo{
    display:flex;
    align-items:center;
    width:300px;
}

.icono{
    width:48px;
    height:58px;
    margin-right:18px;
    flex-shrink:0;
}

.documento{
    width:100%;
    height:100%;
}

.archivo a{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    text-decoration:none;
    white-space:nowrap;
}

.archivo a:hover{
    text-decoration:underline;
}

.rubrica{
    position:fixed;
    right:18px;
    bottom:12px;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:24px;
    font-style:italic;
    color:#555555;
    white-space:nowrap;
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="archivo">

        <div class="icono">
            <svg class="documento"
                 viewBox="0 0 64 76"
                 aria-hidden="true">

                <path d="M8 2h34l14 14v58H8z"
                      fill="#f4f4f4"
                      stroke="#777777"
                      stroke-width="2"/>

                <path d="M42 2v15h14"
                      fill="#e2e2e2"
                      stroke="#777777"
                      stroke-width="2"/>

                <path d="M17 32h29M17 42h29M17 52h23"
                      stroke="#999999"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <path d="M17 62h16"
                      stroke="#999999"
                      stroke-width="2"
                      stroke-linecap="round"/>

            </svg>
        </div>

        <a href="gpx/gr10.gpx">gr10.gpx</a>

    </div>


    <div class="archivo">

        <div class="icono">
            <svg class="documento"
                 viewBox="0 0 64 76"
                 aria-hidden="true">

                <path d="M8 2h34l14 14v58H8z"
                      fill="#f4f4f4"
                      stroke="#777777"
                      stroke-width="2"/>

                <path d="M42 2v15h14"
                      fill="#e2e2e2"
                      stroke="#777777"
                      stroke-width="2"/>

                <path d="M17 32h29M17 42h29M17 52h23"
                      stroke="#999999"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <path d="M17 62h16"
                      stroke="#999999"
                      stroke-width="2"
                      stroke-linecap="round"/>

            </svg>
        </div>

        <a href="gpx/bin.xml" download>bin.xml</a>

    </div>

</div>

<div class="rubrica">Antonio Serrano</div>

</body>
</html>
