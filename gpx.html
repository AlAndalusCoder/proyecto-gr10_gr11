<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archivos GPX</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.contenedor{
    display:flex;
    flex-direction:column;
    align-items:center;

    /* Separación vertical */
    gap:22px;
}

.archivo{
    display:flex;
    align-items:center;
    width:300px;
}

.icono{
    width:48px;
    height:58px;
    margin-right:18px;
    flex-shrink:0;
}

.documento{
    width:100%;
    height:100%;
    display:block;
}

.archivo a{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    text-decoration:none;
    white-space:nowrap;
}

.archivo a:hover{
    text-decoration:underline;
}

/* Firma manuscrita */

.rubrica{
    position:fixed;
    right:18px;
    bottom:12px;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

    font-size:24px;
    font-style:italic;
    color:#555555;

    white-space:nowrap;
}

</style>

</head>

<body>

<div class="contenedor">


<!-- ================= GR10 ================= -->

<div class="archivo">

<div class="icono">

<svg class="documento"
     viewBox="0 0 100 120"
     aria-hidden="true">

    <!-- Hoja -->
    <path
        d="M12 6
           Q7 6 7 12
           V108
           Q7 114 13 114
           H82
           Q88 114 88 108
           V32
           L62 6
           Z"
        fill="#fafafa"
        stroke="#b7b7b7"
        stroke-width="2"/>

    <!-- Esquina doblada -->
    <path
        d="M62 6
           V27
           Q62 32 67 32
           H88
           L62 6 Z"
        fill="#eeeeee"
        stroke="#b7b7b7"
        stroke-width="2"/>

    <!-- Sombra de la esquina -->
    <path
        d="M62 27
           L67 32
           H88
           L62 27 Z"
        fill="#cfcfcf"
        opacity="0.75"/>

    <!-- Texto del documento -->
    <g
        stroke="#b5b5b5"
        stroke-linecap="round"
        opacity="0.72">

        <path d="M22 42 H72" stroke-width="2.2"/>
        <path d="M22 51 H75" stroke-width="2.2"/>
        <path d="M22 60 H74" stroke-width="2.2"/>
        <path d="M22 69 H72" stroke-width="2.2"/>
        <path d="M22 78 H67" stroke-width="2.2"/>

        <path d="M22 91 H72" stroke-width="2.2"/>
        <path d="M22 100 H61" stroke-width="2.2"/>

    </g>

</svg>

</div>

<a href="gpx/gr10.gpx">gr10.gpx</a>

</div>

</html>
