<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archivos GPX</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
}

.contenedor{
    width:fit-content;
    margin:120px auto 0 auto;
    display:flex;
    flex-direction:column;
    gap:55px;
}

.archivo{
    display:grid;
    grid-template-columns:60px auto;
    align-items:center;
    column-gap:20px;
}

.icono{
    font-size:40px;
    text-align:center;
}

.archivo a{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    text-decoration:none;
}

.archivo a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="archivo">
<span class="icono">📄</span>
<a href="gpx/gr10.gpx">gr10.gpx</a>
</div>

<div class="archivo">
<span class="icono">📄</span>
<a href="gpx/bin.xml" download>bin.xml</a>
</div>

</div>

</body>
</html>
